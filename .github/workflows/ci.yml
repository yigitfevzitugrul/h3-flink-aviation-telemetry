name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flink-job:
    name: Flink job (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test ve paketleme
        working-directory: flink-job
        run: mvn -B verify

  python:
    name: Python (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [producer, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements*.txt
      - name: Bağımlılıklar
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt
      - name: Testler
        working-directory: ${{ matrix.service }}
        run: python -m pytest -q

  compose:
    name: docker-compose doğrulama
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
